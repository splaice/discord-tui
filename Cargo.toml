[package]
name = "discord-tui"
version = "0.1.0"
edition = "2024"
description = "A terminal client for Discord chats"

[[bin]]
name = "dt"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
crossterm = "0.29"
futures-util = "0.3"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls-native-roots"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
unicode-width = "0.2"
